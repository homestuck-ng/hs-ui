name: OrangeFox

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h

      - name: Swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Build environment
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses6 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 \
            python-is-python3 openjdk-11-jdk
          git clone --depth 1 https://gitlab.com/OrangeFox/misc/scripts /tmp/ofox-scripts
          sudo bash /tmp/ofox-scripts/setup/android_build_env.sh

      - name: Sync OrangeFox 12.1
        run: |
          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"
          cd "$GITHUB_WORKSPACE/OrangeFox"
          git config --global user.name "hs-ui"
          git config --global user.email "homestuck-ng@users.noreply.github.com"
          git clone --depth 1 https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path "$GITHUB_WORKSPACE/OrangeFox/fox_12.1"

      - name: Clone device tree
        run: |
          TREE="$GITHUB_WORKSPACE/OrangeFox/fox_12.1/device/samsung/r0q"
          mkdir -p "$(dirname "$TREE")"
          rm -rf "$TREE"
          git clone --depth 1 -b fox_12.1 \
            https://github.com/homestuck-ng/android_device_samsung_r0q_twrp.git \
            "$TREE"

      - name: Build recovery
        run: |
          cd "$GITHUB_WORKSPACE/OrangeFox/fox_12.1"
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          set -e
          lunch twrp_r0q-eng
          mka adbd recoveryimage

      - name: Package Odin tar
        id: pack
        run: |
          OUT="$GITHUB_WORKSPACE/OrangeFox/fox_12.1/out/target/product/r0q"
          IMG=$(ls "$OUT"/OrangeFox*.img "$OUT"/recovery.img 2>/dev/null | head -n 1)
          test -n "$IMG"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -a "$IMG" "$GITHUB_WORKSPACE/out/recovery.img"
          # Samsung bootloader expects SEANDROIDENFORCE footer
          if ! tail -c 16 "$GITHUB_WORKSPACE/out/recovery.img" | grep -q SEANDROIDENFORCE; then
            printf 'SEANDROIDENFORCE' >> "$GITHUB_WORKSPACE/out/recovery.img"
          fi
          tar -C "$GITHUB_WORKSPACE/out" -cf \
            "$GITHUB_WORKSPACE/out/OrangeFox-R12.0_A12-Unofficial-r0q-FBE.img.tar" \
            recovery.img
          cp -a "$GITHUB_WORKSPACE/out/OrangeFox-R12.0_A12-Unofficial-r0q-FBE.img.tar" \
            "$GITHUB_WORKSPACE/recovery/OrangeFox-R12.0_A12-Unofficial-r0q.img.tar"
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-R12.0_A12-Unofficial-r0q-FBE
          path: out/OrangeFox-R12.0_A12-Unofficial-r0q-FBE.img.tar
          compression-level: 0
          retention-days: 90
